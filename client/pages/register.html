<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - SmartSpend</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <div class="auth-page">

        <div class="auth-card">

            <div class="auth-logo">
                Smart<span>Spend</span>
            </div>

            <h1>Create Account</h1>

            <p class="auth-subtitle">
                Start managing your money smarter
            </p>


          <form id="registerForm">

                <!-- Name -->
                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- Email -->
                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- Password -->
                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <!-- Confirm Password -->
                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <!-- Terms -->
                <div class="remember">

                    <input
                        type="checkbox"
                        id="terms"
                        required
                    >

                    <label for="terms">
                        I agree to the terms and conditions
                    </label>

                </div>


                <!-- Register Button -->
                <button
                    type="submit"
                    class="auth-btn"
                    style="margin-top: 20px;"
                >
                    Create Account
                </button>

            </form>


            <p class="auth-footer">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>


            <a
                href="../index.html"
                class="back-home"
            >
                ← Back to Home
            </a>

        </div>

    </div>

    <script>
console.log("REGISTER HTML LOADED");
console.log(document.getElementById("registerForm"));
</script>
<script src="../js/app.js"></script>
</body>
</html>
